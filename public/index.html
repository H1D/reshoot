<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Reshoot</title>
  <style>
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: #000; color: #fff; }
    body {
      display: grid;
      place-items: center;
      font: 15px/1.3 -apple-system, system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    #stage { position: relative; isolation: isolate; overflow: hidden; width: 100vw; height: 100dvh; touch-action: none; }
    #stage.framed { width: min(100vw, 100dvh * var(--aspect)); height: min(100dvh, 100vw / var(--aspect)); }
    #cam, #ref { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #cam { transform: scale(var(--zoom)); }
    #cam::-webkit-media-controls, #cam::-webkit-media-controls-start-playback-button { display: none !important; }
    #ref { opacity: var(--opacity); }
    #stage[data-mode="contrast"] :is(#cam, #ref) { filter: grayscale(1) contrast(3); }
    #notes {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }
    #notes p { max-width: 22em; margin: 6px 0; }
    #notes button { padding: 0 20px; border-radius: 22px; background: rgb(255 255 255 / 0.16); pointer-events: auto; }
    .framed #hint, #tapToShow:not([hidden]) ~ #hint { display: none; }
    #bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      gap: 6px;
      padding: 4px max(20px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background: rgb(0 0 0 / 0.5);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }
    button { min-width: 44px; min-height: 44px; padding: 0; border: 0; background: none; color: inherit; font: inherit; }
    #lensRow { position: absolute; right: 0; bottom: 100%; left: 0; display: flex; justify-content: center; padding-bottom: 8px; }
    #lensRow button {
      box-sizing: border-box;
      width: 44px;
      border: 7px solid transparent;
      border-radius: 50%;
      background: rgb(44 44 46 / 0.8) padding-box;
      font-size: 11px;
      font-weight: 600;
    }
    #lensRow [aria-pressed="true"] { border-width: 3px; color: #ffd60a; font-size: 13px; }
    #lensRow [aria-pressed="true"]::after { content: "×"; }
    #modes { display: flex; justify-content: center; }
    #modes button { padding: 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    #modes [aria-pressed="true"] { color: #ffd60a; }
    input[type="range"] { width: 100%; height: 32px; margin: 0; accent-color: #fff; }
    #timeRow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
    #controls { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 20px; }
    .pick {
      position: relative;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      height: 52px;
      overflow: hidden;
      border: 2px solid rgb(255 255 255 / 0.8);
      border-radius: 10px;
      background: rgb(255 255 255 / 0.16);
    }
    .pick::before { content: "+"; font-size: 30px; font-weight: 300; }
    .pick > * { position: absolute; inset: 0; width: 100%; height: 100%; }
    #thumb { object-fit: cover; }
    #file { opacity: 0; }
    #flip { display: grid; place-items: center; height: 52px; border-radius: 50%; background: rgb(255 255 255 / 0.16); }
  </style>
</head>
<body>
  <div id="stage">
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="ref"></canvas>
    <div id="notes">
      <p id="err" hidden></p>
      <p id="badVideo" hidden>This video can't be opened here. Pick an MP4 or a MOV from your camera roll.</p>
      <button id="tapToShow" type="button" hidden>Tap to show the video</button>
      <p id="hint">Tap + to pick a reference video, then move the phone until the two pictures line up.</p>
    </div>
  </div>
  <div id="bar">
    <div id="lensRow" role="group" aria-label="Lens" hidden></div>
    <div id="modes" role="group" aria-label="Overlay mode"></div>
    <div id="timeRow" hidden>
      <span id="now"></span>
      <input id="time" type="range" aria-label="Frame" min="0" step="any" value="0">
      <span id="total"></span>
    </div>
    <div id="controls">
      <label class="pick"><canvas id="thumb" hidden></canvas><input id="file" type="file" accept="video/*" aria-label="Video"></label>
      <input id="opacity" type="range" aria-label="Opacity" min="0" max="1" step="0.01">
      <button id="flip" type="button" aria-label="Flip camera" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5" />
        </svg>
      </button>
    </div>
  </div>
  <script>
    const MODES = { ghost: "Ghost", contrast: "Contrast", edges: "Edges" };
    // ponytail: 35mm-equivalent focal lengths of the Pro iPhone lenses, and 24 mm for the front and any unknown camera.
    // Other models are off by a few mm, which pinch corrects.
    const LENSES = [
      { label: ".5", name: "Back Ultra Wide Camera", mm: 13 },
      { label: "1", name: "Back Camera", mm: 24 },
      { label: "5", name: "Back Telephoto Camera", mm: 120 },
    ];
    const MAIN_MM = 24;
    const MAX_ZOOM = 10;
    const FRONT = "Front Camera";
    const MAX_SIDE = 1280;
    const EDGE_SIDE = 640;
    // ponytail: calibration knobs, checked on one synthetic scene only. The live threshold sits lower so a weaker camera
    // edge under different exposure still counts as a match, and the radius (px at EDGE_SIDE) is how far off it may sit.
    const EDGE_THRESHOLD = 100;
    const MATCH_THRESHOLD = 60;
    const MATCH_RADIUS = 2;
    const LIME = [128, 255, 0, 255];
    const ENVIRONMENT = { facingMode: "environment" };
    const CAMERA_ERRORS = {
      NotAllowedError: "Camera access was denied. Allow it in Settings, then reopen Reshoot.",
      NotFoundError: "No camera found on this device.",
      NotReadableError: "The camera is busy in another app.",
    };

    const [stage, cam, ref, thumb, err, badVideo, tapToShow, file, lensRow, flip, modes, opacity, time, timeRow, now, total] =
      "stage cam ref thumb err badVideo tapToShow file lensRow flip modes opacity time timeRow now total".split(" ").map((id) => document.getElementById(id));
    const refCtx = ref.getContext("2d");
    const thumbCtx = thumb.getContext("2d");
    const scratch = document.createElement("canvas");
    const scratchCtx = scratch.getContext("2d", { willReadFrequently: true });
    const edgeCanvas = document.createElement("canvas");
    const edgeCtx = edgeCanvas.getContext("2d", { willReadFrequently: true });

    const settings = { deviceId: null, backId: null, opacity: 0.5, zoom: 1, ...JSON.parse(localStorage.getItem("reshoot")) };
    if (!Object.hasOwn(MODES, settings.mode)) settings.mode = "edges";
    let frame = null;
    let refEdges = null;
    let source = null;
    let stream = null;
    let active = null;
    let inputs = [];
    let lenses = [];
    let frontId;
    let seeking = false;
    let nextTime = null;
    let saveTimer;

    function save(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        console.warn(`Reshoot could not save ${key}`, error);
      }
    }

    function apply() {
      stage.dataset.mode = settings.mode;
      stage.style.setProperty("--opacity", settings.opacity);
      stage.style.setProperty("--zoom", settings.zoom);
      opacity.value = settings.opacity;
      for (const button of modes.children) button.setAttribute("aria-pressed", button.dataset.mode === settings.mode);
    }

    function update(patch) {
      Object.assign(settings, patch);
      save("reshoot", JSON.stringify(settings));
      apply();
    }

    function stamp(t) {
      // The epsilon keeps float products like 0.29 * 100 = 28.999... from flooring a centisecond short.
      const cs = Math.floor(t * 100 + 1e-6);
      return `${Math.floor(cs / 6000)}:${String(Math.floor(cs / 100) % 60).padStart(2, "0")}.${String(cs % 100).padStart(2, "0")}`;
    }

    function showTime() {
      now.textContent = stamp(time.value);
      time.setAttribute("aria-valuetext", now.textContent);
    }

    function edgeMask({ data, width: w, height: h }, threshold) {
      const lum = new Float32Array(w * h);
      for (let i = 0; i < lum.length; i++) lum[i] = 0.299 * data[4 * i] + 0.587 * data[4 * i + 1] + 0.114 * data[4 * i + 2];
      const mask = new Uint8Array(w * h);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          const gx = lum[i - w + 1] + 2 * lum[i + 1] + lum[i + w + 1] - lum[i - w - 1] - 2 * lum[i - 1] - lum[i + w - 1];
          const gy = lum[i + w - 1] + 2 * lum[i + w] + lum[i + w + 1] - lum[i - w - 1] - 2 * lum[i - w] - lum[i - w + 1];
          mask[i] = gx * gx + gy * gy > threshold ** 2;
        }
      }
      return mask;
    }

    // Spreads each set pixel along its row, then its column, rather than scanning every window, since most of the mask is empty.
    function dilate(mask, w, h, r) {
      const rows = new Uint8Array(mask.length);
      for (let i = 0; i < mask.length; i++) {
        const x = i % w;
        if (mask[i]) rows.fill(1, i - Math.min(x, r), i + Math.min(w - 1 - x, r) + 1);
      }
      const out = new Uint8Array(mask.length);
      for (let i = 0; i < rows.length; i++) {
        if (!rows[i]) continue;
        for (let j = Math.max(i % w, i - r * w); j < Math.min(rows.length, i + (r + 1) * w); j += w) out[j] = 1;
      }
      return out;
    }

    // Samples the camera in the geometry the user sees, a cover crop to the stage aspect divided by the zoom.
    function cameraEdges(w, h) {
      const { videoWidth: vw, videoHeight: vh } = cam;
      if (!vw) return null;
      let sw = vw;
      let sh = vh;
      if (vw / vh > w / h) sw = (vh * w) / h;
      else sh = (vw * h) / w;
      sw /= settings.zoom;
      sh /= settings.zoom;
      edgeCtx.drawImage(cam, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, w, h);
      return dilate(edgeMask(edgeCtx.getImageData(0, 0, w, h), MATCH_THRESHOLD), w, h, MATCH_RADIUS);
    }

    function drawEdges() {
      const { width, height, mask } = refEdges;
      const live = cameraEdges(width, height);
      const out = new ImageData(width, height);
      for (let i = 0; i < mask.length; i++) if (mask[i] && !live?.[i]) out.data.set(LIME, 4 * i);
      ref.width = width;
      ref.height = height;
      refCtx.putImageData(out, 0, 0);
    }

    function render() {
      if (!frame) return;
      if (settings.mode === "edges") return drawEdges();
      ref.width = frame.width;
      ref.height = frame.height;
      refCtx.putImageData(frame, 0, 0);
    }

    function watchCamera() {
      cam.requestVideoFrameCallback(watchCamera);
      if (settings.mode === "edges" && refEdges) drawEdges();
    }

    function setFrame(image, width, height) {
      const scale = Math.min(1, MAX_SIDE / Math.max(width, height));
      scratch.width = Math.round(width * scale);
      scratch.height = Math.round(height * scale);
      scratchCtx.drawImage(image, 0, 0, scratch.width, scratch.height);
      frame = scratchCtx.getImageData(0, 0, scratch.width, scratch.height);
      const edgeScale = Math.min(1, EDGE_SIDE / Math.max(width, height));
      edgeCanvas.width = Math.round(width * edgeScale);
      edgeCanvas.height = Math.round(height * edgeScale);
      edgeCtx.drawImage(scratch, 0, 0, edgeCanvas.width, edgeCanvas.height);
      const edges = edgeCtx.getImageData(0, 0, edgeCanvas.width, edgeCanvas.height);
      refEdges = { width: edges.width, height: edges.height, mask: edgeMask(edges, EDGE_THRESHOLD) };
      thumb.width = scratch.width / 4;
      thumb.height = scratch.height / 4;
      thumbCtx.drawImage(scratch, 0, 0, thumb.width, thumb.height);
      thumb.hidden = false;
      stage.style.setProperty("--aspect", width / height);
      stage.classList.add("framed");
      render();
    }

    function drawSource() {
      setFrame(source, source.videoWidth, source.videoHeight);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => save("reshoot-frame", scratch.toDataURL("image/jpeg", 0.85)), 300);
    }

    function seek(t) {
      if (seeking) {
        nextTime = t;
        return;
      }
      seeking = true;
      // Safari can still hold the previous HDR frame at seeked; this redraws once the new frame is presented.
      source.requestVideoFrameCallback(drawSource);
      source.currentTime = t;
    }

    function onSeeked() {
      drawSource();
      seeking = false;
      if (nextTime !== null) {
        const t = nextTime;
        nextTime = null;
        seek(t);
      }
    }

    const text = (view, at, length) => new TextDecoder().decode(new Uint8Array(view.buffer, view.byteOffset + at, length));

    function* boxes(view, start, end) {
      for (let at = start; at + 8 <= end; ) {
        const size = view.getUint32(at);
        if (size < 8) return;
        yield [text(view, at + 4, 4), at + 8, at + size];
        at += size;
      }
    }

    function* metaTags(view, start, end) {
      for (const [type, from, to] of boxes(view, start, end)) {
        if (type === "trak") yield* metaTags(view, from, to);
        if (type !== "meta") continue;
        // A QuickTime meta box starts straight with hdlr; an ISO one has a version field first.
        const body = text(view, from + 4, 4) === "hdlr" ? from : from + 4;
        const kids = Object.fromEntries([...boxes(view, body, to)].map(([kid, a, b]) => [kid, [a, b]]));
        if (!kids.keys || !kids.ilst) continue;
        const names = [...boxes(view, kids.keys[0] + 8, kids.keys[1])].map(([, a, b]) => text(view, a, b - a));
        for (const [, item, itemEnd] of boxes(view, ...kids.ilst)) {
          const [, data, dataEnd] = boxes(view, item, itemEnd).next().value;
          yield [names[view.getUint32(item - 4) - 1], text(view, data + 8, dataEnd - data - 8)];
        }
      }
    }

    // iPhones tag the video track with the lens and its 35mm-equivalent focal length, digital zoom included.
    async function readShot(videoFile) {
      for (let at = 0; at + 8 <= videoFile.size; ) {
        const head = new DataView(await videoFile.slice(at, at + 16).arrayBuffer());
        const size = head.getUint32(0) === 1 ? Number(head.getBigUint64(8)) : head.getUint32(0);
        if (text(head, 4, 4) === "moov") {
          const moov = new DataView(await videoFile.slice(at, at + size).arrayBuffer());
          const tags = Object.fromEntries(metaTags(moov, 8, moov.byteLength));
          const mm = Number(tags["com.apple.quicktime.camera.focal_length.35mm_equivalent"]);
          return mm > 0 ? { front: /front/i.test(tags["com.apple.quicktime.camera.lens_model"]), mm } : null;
        }
        if (size < 8) return null;
        at += size;
      }
      return null;
    }

    function setZoom(zoom) {
      update({ zoom: Math.min(MAX_ZOOM, Math.max(1, zoom)) });
      showLenses();
    }

    function matchShot({ front, mm }) {
      const lens = front
        ? { id: frontId ?? active, mm: MAIN_MM }
        : lenses.findLast((candidate) => candidate.mm <= mm) ?? lenses[0] ?? { id: active, mm: MAIN_MM };
      setZoom(mm / lens.mm);
      if (lens.id === active) return;
      update(front ? { deviceId: lens.id } : { deviceId: lens.id, backId: lens.id });
      startCamera();
    }

    function loadVideo(videoFile) {
      if (source) {
        source.onseeked = null;
        URL.revokeObjectURL(source.src);
      }
      source = Object.assign(document.createElement("video"), {
        muted: true,
        playsInline: true,
        preload: "auto",
        src: URL.createObjectURL(videoFile),
        onseeked: onSeeked,
      });
      seeking = false;
      nextTime = null;
      badVideo.hidden = true;
      tapToShow.hidden = true;
      timeRow.hidden = true;
      showFirstFrame(videoFile);
      readShot(videoFile).then(
        (shot) => shot && matchShot(shot),
        (error) => console.warn("Reshoot could not read the camera tags", error),
      );
    }

    // iOS Safari draws nothing from a video until playback has presented a frame. That frame is frame 0, and
    // seeking back to where the video already is leaves the next seek's frame stale, so draw it directly.
    // iOS can also refuse to play without a tap, Low Power Mode for one, and then there is no frame to draw.
    async function showFirstFrame(videoFile) {
      const presented = new Promise((resolve) => source.requestVideoFrameCallback(resolve));
      const outcome = await source.play().then(() => "played", (error) => error.name);
      if (outcome === "NotAllowedError") {
        tapToShow.onclick = () => {
          tapToShow.hidden = true;
          showFirstFrame(videoFile);
        };
        tapToShow.hidden = false;
        return;
      }
      if (outcome === "played") await presented;
      source.pause();
      if (!source.error && Number.isNaN(source.duration)) {
        await new Promise((resolve) => Object.assign(source, { onloadedmetadata: resolve, onerror: resolve }));
      }
      if (source.error) {
        badVideo.hidden = false;
        return;
      }
      time.max = source.duration;
      time.value = 0;
      showTime();
      total.textContent = stamp(source.duration);
      timeRow.hidden = false;
      drawSource();
    }

    const backLensId = () =>
      (lenses.find((lens) => lens.id === settings.backId) ?? lenses.find((lens) => lens.label === "1") ?? lenses[0])?.id;

    function showLenses() {
      for (const button of lensRow.children) {
        const lens = lenses.find((candidate) => candidate.id === button.value);
        const on = lens.id === active;
        button.setAttribute("aria-pressed", on);
        button.textContent = on ? String(+((lens.mm * settings.zoom) / MAIN_MM).toFixed(1)).replace(/^0\./, ".") : lens.label;
      }
      lensRow.hidden = !lenses.some((lens) => lens.id === active);
      flip.hidden = inputs.length < 2;
    }

    async function startCamera() {
      active = settings.deviceId;
      showLenses();
      stream?.getTracks().forEach((track) => track.stop());
      const open = (video) =>
        navigator.mediaDevices.getUserMedia({ audio: false, video: { ...video, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      try {
        stream = await open(active ? { deviceId: { exact: active } } : ENVIRONMENT).catch((error) => {
          if (error.name !== "OverconstrainedError") throw error;
          active = null;
          return open(ENVIRONMENT);
        });
        cam.srcObject = stream;
        err.hidden = true;
        active ??= stream.getVideoTracks()[0].getSettings().deviceId;
        inputs = (await navigator.mediaDevices.enumerateDevices()).filter((device) => device.kind === "videoinput");
        const ids = Object.fromEntries(inputs.map((device) => [device.label, device.deviceId]));
        lenses = LENSES.filter((lens) => ids[lens.name]).map((lens) => ({ ...lens, id: ids[lens.name] }));
        frontId = ids[FRONT];
        if (!lensRow.childElementCount) {
          lensRow.append(
            ...lenses.map(({ label, id }) => {
              const button = Object.assign(document.createElement("button"), { type: "button", textContent: label, value: id });
              button.onclick = () => {
                update({ deviceId: id, backId: id, zoom: 1 });
                startCamera();
              };
              return button;
            }),
          );
        }
        // iOS can hand back a virtual multi-lens camera, which jumps between lenses on its own and breaks a fixed framing.
        const back = backLensId();
        if (back && settings.deviceId !== back && ![frontId, ...lenses.map((lens) => lens.id)].includes(active)) {
          update({ deviceId: back });
          return startCamera();
        }
        showLenses();
      } catch (error) {
        err.textContent = !navigator.mediaDevices
          ? "The camera needs a secure (https) connection."
          : CAMERA_ERRORS[error.name] ?? `Camera unavailable: ${error.message}`;
        err.hidden = false;
      }
    }

    for (const [mode, label] of Object.entries(MODES)) {
      const button = Object.assign(document.createElement("button"), { type: "button", textContent: label });
      button.dataset.mode = mode;
      button.onclick = () => {
        update({ mode });
        render();
      };
      modes.append(button);
    }
    opacity.oninput = () => update({ opacity: Number(opacity.value) });
    flip.onclick = () => {
      const order = lenses.length ? [frontId, backLensId()] : inputs.map((device) => device.deviceId);
      update({ deviceId: order[(order.indexOf(active) + 1) % order.length], zoom: 1 });
      startCamera();
    };
    const pointers = new Map();
    const spread = () => {
      const [a, b] = pointers.values();
      return pointers.size === 2 ? Math.hypot(a.x - b.x, a.y - b.y) : 0;
    };
    stage.onpointerdown = (event) => {
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      // The iOS play button is hidden above, so a tap has to be able to start a camera that did not autoplay.
      if (cam.paused && cam.srcObject) cam.play().catch(() => {});
    };
    stage.onpointermove = (event) => {
      if (!pointers.has(event.pointerId)) return;
      const before = spread();
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (before) setZoom((settings.zoom * spread()) / before);
    };
    stage.onpointerup = stage.onpointercancel = (event) => pointers.delete(event.pointerId);
    file.onchange = () => file.files[0] && loadVideo(file.files[0]);
    time.oninput = () => {
      showTime();
      seek(Number(time.value));
    };
    addEventListener("dragover", (event) => event.preventDefault());
    addEventListener("drop", (event) => {
      event.preventDefault();
      const dropped = event.dataTransfer.files[0];
      if (dropped?.type.startsWith("video/")) loadVideo(dropped);
    });

    apply();
    const storedFrame = localStorage.getItem("reshoot-frame");
    if (storedFrame) {
      const image = new Image();
      image.onload = () => setFrame(image, image.naturalWidth, image.naturalHeight);
      image.src = storedFrame;
    }
    startCamera();
    cam.requestVideoFrameCallback(watchCamera);
    navigator.serviceWorker?.register("sw.js");
  </script>
</body>
</html>
